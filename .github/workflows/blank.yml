name: Build Gym Schedule APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'
      cache: gradle

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK packages
    run: |
      sdkmanager "platform-tools"
      sdkmanager "platforms;android-35"
      sdkmanager "build-tools;35.0.0"

  - name: Extract Android Studio project
    run: |
      unzip -q GymSchedule-AndroidStudio.zip -d .
      echo "Project contents:"
      ls -la GymSchedule

  - name: Make Gradle executable
    working-directory: GymSchedule
    run: chmod +x gradlew

  - name: Build Debug APK
    working-directory: GymSchedule
    run: ./gradlew assembleDebug --no-daemon --stacktrace

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Gym-Schedule-APK
      path: GymSchedule/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
