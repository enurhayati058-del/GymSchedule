name: Build Gym Schedule APK

'on':
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q GymSchedule-AndroidStudio.zip
          echo "Project extracted successfully"
          find GymSchedule -maxdepth 3 -type f | sort

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix JVM target
        working-directory: GymSchedule
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("app/build.gradle.kts")
          text = file.read_text()

          old = 'android { namespace="com.example.gymschedule"; compileSdk=35'

          new = '''android {
              namespace="com.example.gymschedule"
              compileSdk=35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }'''

          if old not in text:
              raise SystemExit("Expected Android configuration was not found")

          text = text.replace(old, new, 1)
          file.write_text(text)

          print("JVM target fixed to Java 17")
          print("--- Updated build.gradle.kts ---")
          print(file.read_text())
          PY

      - name: Build APK
        working-directory: GymSchedule
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gym-Schedule-APK
          path: GymSchedule/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
